openapi: 3.0.3

info:
  title: SESAU – API de Contratos, Pagamentos e ARP
  description: |
    API pública para consulta de dados oficiais da Secretaria de Saúde do Recife (SESAU),
    incluindo contratos administrativos, pagamentos realizados e Atas de Registro de Preços (ARP).

    Esta API é utilizada como backend para sistemas de transparência, painéis gerenciais
    e agentes de IA (ex: IAGestora).
  version: 1.0.0
  contact:
    name: SESAU Recife
    url: https://www.recife.pe.gov.br
  license:
    name: Uso institucional público

servers:
  - url: https://SEU-DOMINIO.vercel.app/api
    description: Produção (Vercel)

tags:
  - name: Contratos
    description: Consulta de contratos administrativos
  - name: Pagamentos
    description: Consulta de pagamentos realizados
  - name: ARP
    description: Monitoramento de Atas de Registro de Preços

paths:

  /contratos:
    get:
      tags:
        - Contratos
      summary: Listar contratos administrativos
      description: Retorna contratos com filtro opcional por credor ou número.
      parameters:
        - name: busca
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de contratos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contrato'

  /pagamentos:
    get:
      tags:
        - Pagamentos
      summary: Listar pagamentos realizados
      description: Retorna pagamentos com filtros por credor e mês.
      parameters:
        - name: busca
          in: query
          schema:
            type: string
        - name: mes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Lista de pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pagamento'

  /arp:
    get:
      tags:
        - ARP
      summary: Listar Atas de Registro de Preços
      description: Retorna ARPs vigentes e encerradas.
      parameters:
        - name: busca
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de ARPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ARP'

components:
  schemas:

    Contrato:
      type: object
      properties:
        credor:
          type: string
        numeroContrato:
          type: string
        executiva:
          type: string
        gestor:
          type: string
        inicioVigencia:
          type: string
        fimVigencia:
          type: string
        valorTotal:
          type: string
        valorMensal:
          type: string
        statusVigencia:
          type: string

    Pagamento:
      type: object
      properties:
        fonte:
          type: string
        credor:
          type: string
        valorPagamento:
          type: string
        documentoOB:
          type: string
        numeroDocFiscal:
          type: string
        dataPagamento:
          type: string

    ARP:
      type: object
      properties:
        numeroAta:
          type: string
        fornecedor:
          type: string
        inicioVigencia:
          type: string
        fimVigencia:
          type: string
        status:
          type: string
