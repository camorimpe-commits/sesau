openapi: 3.0.3

info:
  title: SESAU – API de Contratos, Pagamentos e ARP
  description: |
    API pública para consulta de dados oficiais da Secretaria de Saúde do Recife (SESAU),
    incluindo contratos administrativos, pagamentos realizados e Atas de Registro de Preços (ARP).

    Esta API é utilizada como backend para sistemas de transparência, painéis gerenciais
    e agentes de IA (ex: IAGestora).
  version: 1.0.0
  contact:
    name: SESAU Recife
    description: Secretaria de Saúde do Recife
  license:
    name: Uso público institucional

servers:
  - url: https://SEU-DOMINIO.vercel.app/api
    description: Produção (Vercel)

tags:
  - name: Contratos
    description: Consulta de contratos administrativos
  - name: Pagamentos
    description: Consulta de pagamentos realizados
  - name: ARP
    description: Monitoramento de Atas de Registro de Preços (ARP / ARP_MMH)

paths:

  /contratos:
    get:
      tags: [Contratos]
      summary: Listar contratos
      description: Retorna a lista de contratos administrativos cadastrados.
      parameters:
        - name: search
          in: query
          description: Número do contrato ou nome do credor
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de contratos
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contrato'

  /pagamentos:
    get:
      tags: [Pagamentos]
      summary: Listar pagamentos
      description: Retorna pagamentos realizados, com filtros por credor, documento e mês.
      parameters:
        - name: search
          in: query
          description: Nome do credor, Documento OB ou Nº Doc Fiscal
          required: false
          schema:
            type: string
        - name: mes
          in: query
          description: Mês do pagamento (1–12)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Lista de pagamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_registros:
                    type: integer
                  valor_total:
                    type: number
                    format: double
                    example: 1250000.75
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pagamento'

  /arp:
    get:
      tags: [ARP]
      summary: Listar Atas de Registro de Preços (ARP)
      description: |
        Retorna dados de monitoramento das Atas de Registro de Preços (ARP),
        incluindo vigência, status, quantidades licitadas, recebidas e saldo.
      parameters:
        - name: item
          in: query
          description: Nome do item
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Status da vigência (VIGENTE, VENCIDA, A VENCER)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de ARPs
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ARP'

components:
  schemas:

    Contrato:
      type: object
      properties:
        credor:
          type: string
          example: PERNAMBUCO CONSERVADORA
        numero_contrato:
          type: string
          example: "4801.0075/2020"
        executiva:
          type: string
          example: SEAF
        gestor:
          type: string
          example: RUBEM GUILHERME
        inicio_vigencia:
          type: string
          example: "10/04/2025"
        fim_vigencia:
          type: string
          example: "09/04/2026"
        valor_total:
          type: string
          example: "1.557.330,96"
        valor_mensal:
          type: string
          example: "129.777,58"
        termo_atual:
          type: string
          example: "6"
        dias_para_vencimento:
          type: string
          example: "66"
        status_vigencia:
          type: string
          example: VIGENTE
        mais_recente:
          type: string
          example: Sim

    Pagamento:
      type: object
      properties:
        credor:
          type: string
          example: TICKET SOLUÇÕES HDFGT S/A
        documento_ob:
          type: string
          example: 2026OB000331
        fonte:
          type: string
          example: 500-RECURSOS NÃO VINCULADOS DE IMPOSTOS
        valor_pagamento:
          type: string
          example: "360.192,26"
        numero_doc_fiscal:
          type: string
          example: "51467709"
        data_pagamento:
          type: string
          example: "05/02/2026"

    ARP:
      type: object
      properties:
        item:
          type: string
          example: LUVA DE PROCEDIMENTO
        numero_ata:
          type: string
          example: "ARP-012/2025"
        vigencia_ata:
          type: string
          example: "01/01/2025 a 31/12/2025"
        dias:
          type: string
          example: "120"
        status_vigencia:
          type: string
          example: VIGENTE
        sei_processo:
          type: string
          example: "SEI 1234567-8"
        total_licitado:
          type: number
          example: 100000
        total_recebido:
          type: number
          example: 65000
        saldo_a_receber:
          type: number
          example: 35000
        nota_fiscal:
          type: string
          example: "NF-987654"
        data_recebimento:
          type: string
          example: "15/03/2025"
